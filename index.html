<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ReachALL — 推广情报中台</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:ital,wght@0,400;0,700;1,400&family=Noto+Sans+SC:wght@300;400;500;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #0a0a0f;
      --surface: #111118;
      --surface2: #18181f;
      --border: rgba(255,255,255,0.06);
      --border-bright: rgba(255,255,255,0.12);
      --accent: #e8ff47;
      --accent2: #ff4766;
      --accent3: #47d4ff;
      --text: #f0f0f5;
      --text-dim: rgba(240,240,245,0.45);
      --text-mid: rgba(240,240,245,0.7);
      --weibo: #e6162d;
      --douyin: #fe2c55;
      --xhs: #ff2442;
      --radius: 10px;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Noto Sans SC', sans-serif;
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* ── NOISE OVERLAY ── */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.75' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");
      pointer-events: none;
      z-index: 1000;
      opacity: 0.5;
    }

    /* ── SIDEBAR ── */
    .sidebar {
      position: fixed;
      left: 0; top: 0; bottom: 0;
      width: 220px;
      background: var(--surface);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      z-index: 100;
      padding: 28px 0 20px;
    }

    .logo {
      padding: 0 24px 28px;
      border-bottom: 1px solid var(--border);
    }

    .logo-mark {
      font-family: 'Space Mono', monospace;
      font-size: 18px;
      font-weight: 700;
      color: var(--accent);
      letter-spacing: -0.5px;
    }

    .logo-sub {
      font-size: 11px;
      color: var(--text-dim);
      margin-top: 3px;
      letter-spacing: 1.5px;
      text-transform: uppercase;
    }

    .nav {
      padding: 20px 14px;
      flex: 1;
    }

    .nav-section-label {
      font-size: 10px;
      color: var(--text-dim);
      letter-spacing: 2px;
      text-transform: uppercase;
      padding: 0 10px;
      margin-bottom: 8px;
      margin-top: 16px;
    }

    .nav-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 9px 10px;
      border-radius: 7px;
      cursor: pointer;
      font-size: 13.5px;
      color: var(--text-mid);
      transition: all 0.15s;
      position: relative;
    }

    .nav-item:hover { background: var(--surface2); color: var(--text); }

    .nav-item.active {
      background: rgba(232,255,71,0.08);
      color: var(--accent);
    }

    .nav-item.active::before {
      content: '';
      position: absolute;
      left: 0; top: 20%; bottom: 20%;
      width: 2.5px;
      background: var(--accent);
      border-radius: 2px;
    }

    .nav-icon {
      width: 16px;
      height: 16px;
      opacity: 0.8;
      flex-shrink: 0;
    }

    .nav-badge {
      margin-left: auto;
      background: var(--accent2);
      color: #fff;
      font-size: 10px;
      font-family: 'Space Mono', monospace;
      padding: 1px 6px;
      border-radius: 10px;
    }

    .sidebar-bottom {
      padding: 16px 14px;
      border-top: 1px solid var(--border);
    }

    .status-dot {
      width: 7px; height: 7px;
      border-radius: 50%;
      background: #22c55e;
      box-shadow: 0 0 8px #22c55e;
      display: inline-block;
      margin-right: 8px;
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0%,100% { opacity: 1; }
      50% { opacity: 0.4; }
    }

    .status-label {
      font-size: 11.5px;
      color: var(--text-dim);
    }

    /* ── MAIN ── */
    .main {
      margin-left: 220px;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* ── TOPBAR ── */
    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 32px;
      border-bottom: 1px solid var(--border);
      background: rgba(10,10,15,0.8);
      backdrop-filter: blur(12px);
      position: sticky;
      top: 0;
      z-index: 50;
    }

    .topbar-title {
      font-size: 15px;
      font-weight: 500;
      color: var(--text);
    }

    .topbar-right {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .platform-filter {
      display: flex;
      gap: 6px;
    }

    .pf-btn {
      font-size: 11.5px;
      padding: 5px 12px;
      border-radius: 20px;
      border: 1px solid var(--border-bright);
      background: transparent;
      color: var(--text-mid);
      cursor: pointer;
      font-family: 'Noto Sans SC', sans-serif;
      transition: all 0.15s;
    }

    .pf-btn:hover { border-color: var(--border-bright); color: var(--text); background: var(--surface2); }
    .pf-btn.active { background: var(--accent); color: #0a0a0f; border-color: var(--accent); font-weight: 700; }

    .pf-btn.wb.active   { background: var(--weibo);  color: #fff; border-color: var(--weibo);  }
    .pf-btn.dy.active   { background: var(--douyin); color: #fff; border-color: var(--douyin); }
    .pf-btn.xhs.active  { background: var(--xhs);    color: #fff; border-color: var(--xhs);    }
    .pf-btn.bili.active { background: #00a1d6;        color: #fff; border-color: #00a1d6;       }
    .pf-btn.v2.active   { background: #3b82f6;        color: #fff; border-color: #3b82f6;       }

    .refresh-btn {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      padding: 6px 14px;
      border-radius: 7px;
      border: 1px solid var(--border-bright);
      background: var(--surface2);
      color: var(--text-mid);
      cursor: pointer;
      font-family: 'Noto Sans SC', sans-serif;
      transition: all 0.15s;
    }

    .refresh-btn:hover { color: var(--accent); border-color: var(--accent); }
    .refresh-btn.spinning svg { animation: spin 1s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── CONTENT AREA ── */
    .content {
      padding: 28px 32px;
      flex: 1;
    }

    /* ── VIEWS ── */
    .view { display: none; }
    .view.active { display: block; }

    /* ── STATS ROW ── */
    .stats-row {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 14px;
      margin-bottom: 28px;
    }

    .stat-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 18px 20px;
      position: relative;
      overflow: hidden;
    }

    .stat-card::after {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 2px;
      background: var(--accent);
      opacity: 0.6;
    }

    .stat-card:nth-child(2)::after { background: var(--accent2); }
    .stat-card:nth-child(3)::after { background: var(--accent3); }
    .stat-card:nth-child(4)::after { background: #a855f7; }

    .stat-label {
      font-size: 11px;
      color: var(--text-dim);
      letter-spacing: 1px;
      text-transform: uppercase;
      margin-bottom: 10px;
    }

    .stat-value {
      font-family: 'Space Mono', monospace;
      font-size: 26px;
      font-weight: 700;
      color: var(--text);
    }

    .stat-delta {
      font-size: 11px;
      color: #22c55e;
      margin-top: 4px;
    }

    /* ── TRENDS GRID ── */
    .section-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
    }

    .section-title {
      font-size: 13px;
      font-weight: 500;
      color: var(--text-dim);
      letter-spacing: 1.5px;
      text-transform: uppercase;
    }

    .section-meta {
      font-family: 'Space Mono', monospace;
      font-size: 11px;
      color: var(--text-dim);
    }

    .trends-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .trend-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 16px 20px;
      display: grid;
      grid-template-columns: 44px 1fr auto;
      align-items: center;
      gap: 16px;
      cursor: pointer;
      transition: all 0.18s;
      position: relative;
      overflow: hidden;
    }

    .trend-card::before {
      z-index: 0;
      content: '';
      position: absolute;
      left: 0; top: 0; bottom: 0;
      width: 0;
      background: rgba(232,255,71,0.04);
      transition: width 0.25s ease;
    }

    .trend-card:hover::before { width: 100%; }
    .trend-card:hover { border-color: var(--border-bright); }

    .trend-rank {
      font-family: 'Space Mono', monospace;
      font-size: 22px;
      font-weight: 700;
      color: var(--text-dim);
      text-align: center;
      line-height: 1;
    }

    .trend-rank.top3 { color: var(--accent); }

    .trend-body {}

    .trend-title {
      font-size: 14.5px;
      font-weight: 500;
      color: var(--text);
      margin-bottom: 6px;
      line-height: 1.4;
    }

    .trend-meta-row {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .platform-tag {
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.5px;
      padding: 2px 7px;
      border-radius: 4px;
    }

    .tag-weibo    { background: rgba(230,22,45,0.15);  color: #e6162d; }
    .tag-douyin   { background: rgba(254,44,85,0.15);  color: #fe2c55; }
    .tag-xhs      { background: rgba(255,36,66,0.12);  color: #ff6680; }
    .tag-bilibili { background: rgba(0,161,214,0.12);  color: #00a1d6; }
    .tag-v2ex     { background: rgba(125,211,252,0.1); color: #7dd3fc; }

    .heat-bar {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .heat-value {
      font-family: 'Space Mono', monospace;
      font-size: 11px;
      color: var(--text-dim);
    }

    .heat-track {
      width: 80px;
      height: 3px;
      background: rgba(255,255,255,0.08);
      border-radius: 2px;
      overflow: hidden;
    }

    .heat-fill {
      height: 100%;
      border-radius: 2px;
      background: linear-gradient(90deg, var(--accent3), var(--accent));
      transition: width 0.8s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .trend-change {
      font-family: 'Space Mono', monospace;
      font-size: 11px;
      color: var(--text-dim);
    }

    .trend-change.up { color: #22c55e; }
    .trend-change.down { color: var(--accent2); }

    .trend-actions {
      position: relative;
      z-index: 3;
      display: flex;
      gap: 8px;
      flex-shrink: 0;
    }

    .action-btn {
      position: relative;
      z-index: 2;
      display: flex;
      align-items: center;
      gap: 5px;
      font-size: 11.5px;
      padding: 6px 12px;
      border-radius: 6px;
      border: 1px solid var(--border-bright);
      background: transparent;
      color: var(--text-mid);
      cursor: pointer;
      font-family: 'Noto Sans SC', sans-serif;
      transition: all 0.15s;
      white-space: nowrap;
      text-decoration: none;
    }

    .action-btn:hover { background: var(--surface2); color: var(--text); }

    .action-btn.primary {
      background: var(--accent);
      color: #0a0a0f;
      border-color: var(--accent);
      font-weight: 700;
    }

    .action-btn.primary:hover { background: #d4eb3d; border-color: #d4eb3d; }

    /* ── MODAL ── */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.7);
      backdrop-filter: blur(8px);
      z-index: 500;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s;
    }

    .modal-overlay.open {
      opacity: 1;
      pointer-events: all;
    }

    .modal {
      background: var(--surface);
      border: 1px solid var(--border-bright);
      border-radius: 14px;
      width: 620px;
      max-width: 95vw;
      max-height: 88vh;
      overflow-y: auto;
      transform: translateY(16px) scale(0.98);
      transition: transform 0.22s cubic-bezier(0.4,0,0.2,1);
    }

    .modal-overlay.open .modal {
      transform: translateY(0) scale(1);
    }

    .modal-header {
      padding: 24px 28px 20px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 16px;
    }

    .modal-topic-label {
      font-size: 10px;
      color: var(--text-dim);
      letter-spacing: 1.5px;
      text-transform: uppercase;
      margin-bottom: 6px;
    }

    .modal-topic-title {
      font-size: 17px;
      font-weight: 500;
      color: var(--text);
      line-height: 1.4;
    }

    .modal-close {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 6px;
      width: 30px; height: 30px;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer;
      color: var(--text-dim);
      flex-shrink: 0;
      transition: all 0.15s;
    }

    .modal-close:hover { color: var(--text); background: var(--border); }

    .modal-body { padding: 24px 28px; }

    .gen-form {}

    .form-row {
      margin-bottom: 18px;
    }

    .form-label {
      font-size: 11.5px;
      color: var(--text-dim);
      letter-spacing: 0.5px;
      margin-bottom: 8px;
      display: block;
    }

    .tone-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 7px;
    }

    .tone-btn {
      padding: 8px 6px;
      border-radius: 7px;
      border: 1px solid var(--border-bright);
      background: transparent;
      color: var(--text-mid);
      font-size: 12px;
      cursor: pointer;
      font-family: 'Noto Sans SC', sans-serif;
      text-align: center;
      transition: all 0.15s;
    }

    .tone-btn:hover { background: var(--surface2); color: var(--text); }
    .tone-btn.active { background: rgba(232,255,71,0.1); color: var(--accent); border-color: var(--accent); }

    .platform-grid {
      display: flex;
      gap: 7px;
    }

    .plat-select-btn {
      flex: 1;
      padding: 8px;
      border-radius: 7px;
      border: 1px solid var(--border-bright);
      background: transparent;
      color: var(--text-mid);
      font-size: 12px;
      cursor: pointer;
      font-family: 'Noto Sans SC', sans-serif;
      text-align: center;
      transition: all 0.15s;
    }

    .plat-select-btn:hover { background: var(--surface2); }
    .plat-select-btn.active.wb { background: rgba(230,22,45,0.1); color: #e6162d; border-color: #e6162d; }
    .plat-select-btn.active.dy { background: rgba(254,44,85,0.1); color: #fe2c55; border-color: #fe2c55; }
    .plat-select-btn.active.xhs { background: rgba(255,36,66,0.08); color: #ff6680; border-color: #ff6680; }
    .plat-select-btn.active.wx { background: rgba(255,87,34,0.1); color: #FF5722; border-color: #FF5722; }

    .form-textarea {
      width: 100%;
      background: var(--surface2);
      border: 1px solid var(--border-bright);
      border-radius: 8px;
      padding: 12px 14px;
      color: var(--text);
      font-family: 'Noto Sans SC', sans-serif;
      font-size: 13.5px;
      resize: vertical;
      min-height: 90px;
      outline: none;
      transition: border-color 0.15s;
    }

    .form-textarea:focus { border-color: rgba(232,255,71,0.4); }
    .form-textarea::placeholder { color: var(--text-dim); }

    .gen-output {
      background: var(--surface2);
      border: 1px solid var(--border-bright);
      border-radius: 8px;
      padding: 16px;
      min-height: 140px;
      position: relative;
    }

    .gen-output-placeholder {
      color: var(--text-dim);
      font-size: 13px;
      text-align: center;
      padding: 24px 0;
    }

    .gen-output-text {
      font-size: 14px;
      line-height: 1.75;
      color: var(--text);
      white-space: pre-wrap;
    }

    .gen-output-text.typing::after {
      content: '▋';
      animation: blink 0.8s infinite;
      color: var(--accent);
    }

    @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0} }

    .gen-actions {
      display: flex;
      gap: 8px;
      margin-top: 14px;
    }

    .gen-btn {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 13px;
      padding: 10px 20px;
      border-radius: 8px;
      border: none;
      cursor: pointer;
      font-family: 'Noto Sans SC', sans-serif;
      font-weight: 500;
      transition: all 0.15s;
    }

    .gen-btn.primary {
      background: var(--accent);
      color: #0a0a0f;
      flex: 1;
    }

    .gen-btn.primary:hover { background: #d4eb3d; }
    .gen-btn.primary:disabled { opacity: 0.5; cursor: not-allowed; }

    .gen-btn.secondary {
      background: var(--surface2);
      border: 1px solid var(--border-bright);
      color: var(--text-mid);
    }

    .gen-btn.secondary:hover { color: var(--text); background: var(--border); }

    .char-count {
      position: absolute;
      bottom: 10px;
      right: 14px;
      font-family: 'Space Mono', monospace;
      font-size: 10px;
      color: var(--text-dim);
    }

    /* ── LIBRARY VIEW ── */
    .lib-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 14px;
    }

    .lib-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 18px;
      cursor: pointer;
      transition: all 0.18s;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .lib-card:hover { border-color: var(--border-bright); transform: translateY(-2px); }

    .lib-card-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .lib-card-platform { font-size: 10px; font-weight: 700; }
    .lib-card-date { font-family: 'Space Mono', monospace; font-size: 10px; color: var(--text-dim); }

    .lib-card-content {
      font-size: 13px;
      color: var(--text-mid);
      line-height: 1.65;
      display: -webkit-box;
      -webkit-line-clamp: 4;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .lib-card-topic {
      font-size: 11px;
      color: var(--text-dim);
      padding: 5px 9px;
      background: var(--surface2);
      border-radius: 5px;
      align-self: flex-start;
    }

    .lib-card-footer {
      display: flex;
      gap: 7px;
      margin-top: auto;
    }

    .lib-action {
      flex: 1;
      font-size: 11.5px;
      padding: 6px 0;
      border-radius: 6px;
      border: 1px solid var(--border-bright);
      background: transparent;
      color: var(--text-mid);
      cursor: pointer;
      font-family: 'Noto Sans SC', sans-serif;
      text-align: center;
      transition: all 0.15s;
    }

    .lib-action:hover { background: var(--surface2); color: var(--text); }
    .lib-action.copy:hover { border-color: var(--accent); color: var(--accent); }

    /* ── EMPTY STATE ── */
    .empty-state {
      text-align: center;
      padding: 60px 0;
      color: var(--text-dim);
      font-size: 14px;
    }

    .empty-icon { font-size: 40px; margin-bottom: 14px; opacity: 0.4; }

    /* ── LOADING SKELETON ── */
    .skeleton {
      background: linear-gradient(90deg, var(--surface) 25%, var(--surface2) 50%, var(--surface) 75%);
      background-size: 200% 100%;
      animation: shimmer 1.4s infinite;
      border-radius: 4px;
    }

    @keyframes shimmer {
      0% { background-position: 200% 0; }
      100% { background-position: -200% 0; }
    }

    /* ── COPY TOAST ── */
    .toast {
      position: fixed;
      bottom: 32px;
      left: 50%;
      transform: translateX(-50%) translateY(20px);
      background: var(--surface);
      border: 1px solid var(--accent);
      color: var(--accent);
      font-size: 13px;
      padding: 10px 20px;
      border-radius: 8px;
      opacity: 0;
      transition: all 0.25s;
      pointer-events: none;
      z-index: 999;
      font-family: 'Space Mono', monospace;
    }

    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    /* ── SCROLLBAR ── */
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.2); }

    /* ── ANIMATIONS ── */
    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .trend-card {
      animation: fadeInUp 0.3s ease both;
    }

    .trend-card:nth-child(1) { animation-delay: 0.03s; }
    .trend-card:nth-child(2) { animation-delay: 0.06s; }
    .trend-card:nth-child(3) { animation-delay: 0.09s; }
    .trend-card:nth-child(4) { animation-delay: 0.12s; }
    .trend-card:nth-child(5) { animation-delay: 0.15s; }
    .trend-card:nth-child(6) { animation-delay: 0.18s; }
    .trend-card:nth-child(7) { animation-delay: 0.21s; }
    .trend-card:nth-child(8) { animation-delay: 0.24s; }
    .trend-card:nth-child(9) { animation-delay: 0.27s; }
    .trend-card:nth-child(10) { animation-delay: 0.30s; }
  </style>

<script>
// ── CONFIG ──
const API_BASE = 'http://localhost:8765';

// ── STATE ──
let allTrends = [];
let filteredTrends = [];
let currentPlatFilter = 'all';
let library = JSON.parse(localStorage.getItem('reachall_library') || '[]');
let currentTopic = null;
let currentPlatform = 'weibo';
let currentTone = '营销种草';
let generatedText = '';
let isGenerating = false;
let serverOnline = false;

// ── PLATFORM META ──
const PLAT_META = {
  weibo:    { label: '微博',   tagClass: 'tag-weibo'   },
  douyin:   { label: '抖音',   tagClass: 'tag-douyin'  },
  xhs:      { label: '小红书', tagClass: 'tag-xhs'     },
  bilibili: { label: 'B站',    tagClass: 'tag-bilibili'},
  v2ex:     { label: 'V2EX',   tagClass: 'tag-v2ex'    },
};

// ── SERVER STATUS ──
async function checkServer() {
  try {
    const res = await fetch(`${API_BASE}/api/health`, { signal: AbortSignal.timeout(2000) });
    serverOnline = res.ok;
  } catch {
    serverOnline = false;
  }
  const dot = document.querySelector('.status-dot');
  const label = document.querySelector('.status-label');
  if (serverOnline) {
    dot.style.background = '#22c55e';
    dot.style.boxShadow = '0 0 8px #22c55e';
    label.textContent = '数据服务在线';
  } else {
    dot.style.background = '#ef4444';
    dot.style.boxShadow = '0 0 8px #ef4444';
    label.textContent = '服务离线';
  }
}

// ── LOAD & RENDER ──

async function loadTrends() {
  console.log('[loadTrends] called, serverOnline will be checked...');
  const btn = document.getElementById('refresh-btn');
  btn.classList.add('spinning');

  await checkServer();

  let items = [];
  let sources = {};

  if (serverOnline) {
    try {
      const res = await fetch(`${API_BASE}/api/trends`, { signal: AbortSignal.timeout(15000) });
      const data = await res.json();
      if (data.ok) {
        items = data.items || [];
        sources = data.sources || {};
      }
    } catch(e) {
      console.warn('API fetch failed:', e);
    }
  }

  // Fallback: annotate items with change direction (server doesn't compute this)
  allTrends = items.map(t => ({ ...t, change: randomChange() }));
  applyFilter();

  // Stats
  const wbItems  = allTrends.filter(t => t.platform === 'weibo');
  const dyItems  = allTrends.filter(t => t.platform === 'douyin');
  const biliItems = allTrends.filter(t => t.platform === 'bilibili');

  const maxWbHeat  = wbItems.reduce((m, t) => t.heat > m ? t.heat : m, 0);
  const maxDyHeat  = dyItems.reduce((m, t) => t.heat > m ? t.heat : m, 0);

  const sourceSummary = Object.entries(sources)
    .map(([k, v]) => `${PLAT_META[k]?.label || k} ${v}`)
    .join(' · ');

  document.getElementById('stat-total').textContent = allTrends.length;
  document.getElementById('stat-total-d').textContent = sourceSummary || '暂无数据';
  document.getElementById('stat-wb-peak').textContent = formatHeat(maxWbHeat) || '—';
  document.getElementById('stat-dy-peak').textContent = formatHeat(maxDyHeat) || '—';
  document.getElementById('total-badge').textContent = allTrends.length || '—';
  document.getElementById('last-update').textContent =
    '更新于 ' + new Date().toLocaleTimeString('zh-CN', {hour:'2-digit', minute:'2-digit'});

  btn.classList.remove('spinning');
  updateStats();
}

function randomChange() {
  const n = Math.floor(Math.random() * 16) - 6;
  if (n > 0) return { dir: 'up', val: '+' + n };
  if (n < 0) return { dir: 'down', val: String(n) };
  return { dir: '', val: '—' };
}

function formatHeat(n) {
  if (!n) return '—';
  if (n >= 100000000) return (n / 100000000).toFixed(1) + '亿';
  if (n >= 10000000)  return (n / 10000000).toFixed(1) + '千万';
  if (n >= 10000)     return (n / 10000).toFixed(0) + '万';
  return String(n);
}

function applyFilter() {
  filteredTrends = currentPlatFilter === 'all'
    ? [...allTrends]
    : allTrends.filter(t => t.platform === currentPlatFilter);

  // Re-rank within filter
  filteredTrends.sort((a, b) => b.heat - a.heat);
  filteredTrends.forEach((t, i) => t.displayRank = i + 1);

  renderTrends();
}

const maxHeat = () => Math.max(...filteredTrends.map(t => t.heat), 1);

function renderTrends() {
  const list = document.getElementById('trends-list');
  console.log('[renderTrends] called, items:', filteredTrends.length);
  if (!filteredTrends.length) {
    list.innerHTML = '<div class="empty-state"><div class="empty-icon">○</div><div>暂无数据</div></div>';
    return;
  }

  const max = maxHeat();
  list.innerHTML = filteredTrends.map(t => {
    const pct = Math.round((t.heat / max) * 100);
    const meta = PLAT_META[t.platform] || { label: t.platform, tagClass: 'tag-weibo' };
    const platTag = meta.label;
    const platClass = meta.tagClass;
    const rankClass = t.displayRank <= 3 ? 'trend-rank top3' : 'trend-rank';
    const changeClass = t.change.dir === 'up' ? 'trend-change up' : t.change.dir === 'down' ? 'trend-change down' : 'trend-change';

    return `
      <div class="trend-card">
        <div class="${rankClass}">${String(t.displayRank).padStart(2,'0')}</div>
        <div class="trend-body">
          <div class="trend-title">${t.title}</div>
          <div class="trend-meta-row">
            <span class="platform-tag ${platClass}">${platTag}</span>
            <div class="heat-bar">
              <span class="heat-value">${t.heatLabel}</span>
              <div class="heat-track"><div class="heat-fill" style="width:${pct}%"></div></div>
            </div>
            <span class="${changeClass}">${t.change.val}</span>
          </div>
        </div>
        <div class="trend-actions">
          <a class="action-btn" href="${t.url || '#'}" target="_blank" rel="noopener noreferrer">
            <svg width="12" height="12" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8">
              <path d="M7 3H3a1 1 0 0 0-1 1v9a1 1 0 0 0 1 1h9a1 1 0 0 0 1-1V9"/>
              <polyline points="10,2 14,2 14,6"/><line x1="14" y1="2" x2="7" y2="9"/>
            </svg>
            查看
          </a>
          <button class="action-btn primary" onclick="openGenModal('${t.id}')">
            <svg width="12" height="12" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2">
              <polygon points="3,2 13,8 3,14"/>
            </svg>
            生成推文
          </button>
        </div>
      </div>
    `;
  }).join('');
}

// ── FILTER ──

function setPlatformFilter(plat, btn) {
  currentPlatFilter = plat;
  document.querySelectorAll('.pf-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  applyFilter();
}

function filterPlatform(plat) {
  currentPlatFilter = plat;
  document.querySelectorAll('.pf-btn').forEach(b => b.classList.remove('active'));
  const map = { weibo: 1, douyin: 2, xhs: 3, bilibili: 4, v2ex: 5 };
  const idx = map[plat];
  if (idx !== undefined) document.querySelectorAll('.pf-btn')[idx]?.classList.add('active');
  switchView('trends', document.querySelectorAll('.nav-item')[0]);
  applyFilter();
}

// ── VIEWS ──

function switchView(view, navEl) {
  document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
  document.getElementById('view-' + view).classList.add('active');
  document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
  if (navEl) navEl.classList.add('active');

  const titles = { trends: '实时热榜', library: '推文库' };
  document.getElementById('view-title').textContent = titles[view] || view;

  const pfFilter = document.getElementById('pf-filter');
  pfFilter.style.display = view === 'trends' ? 'flex' : 'none';

  if (view === 'library') renderLibrary();
}

// ── MODAL ──

function openGenModal(trendId) {
  currentTopic = filteredTrends.find(t => t.id === trendId) || allTrends.find(t => t.id === trendId);
  if (!currentTopic) return;

  document.getElementById('modal-topic').textContent = currentTopic.title;
  document.getElementById('output-placeholder').style.display = 'block';
  document.getElementById('output-text').style.display = 'none';
  document.getElementById('output-text').textContent = '';
  document.getElementById('char-count').textContent = '';
  document.getElementById('extra-prompt').value = '';
  document.getElementById('save-btn').style.display = 'none';
  document.getElementById('copy-btn').style.display = 'none';
  generatedText = '';

  // Set default platform to match trend
  document.querySelectorAll('.plat-select-btn').forEach(b => {
    b.classList.remove('active');
    if (b.dataset.plat === currentTopic.platform) b.classList.add('active');
  });
  currentPlatform = currentTopic.platform;

  document.getElementById('modal-overlay').classList.add('open');
}

function closeModal(e) {
  if (e && e.target !== document.getElementById('modal-overlay')) return;
  if (!e) document.getElementById('modal-overlay').classList.remove('open');
  else document.getElementById('modal-overlay').classList.remove('open');
}

function selectPlat(btn) {
  document.querySelectorAll('.plat-select-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  currentPlatform = btn.dataset.plat;
  // 公众号平台：更新生成按钮文案
  const genLabel = document.getElementById('gen-btn-label');
  if (currentPlatform === 'wechat') {
    genLabel.textContent = '生成公众号文章';
  } else {
    genLabel.textContent = '生成推文';
  }
}

function handleGenerate() {
  if (currentPlatform === 'wechat') {
    generateWechat();
  } else {
    generatePost();
  }
}

function selectTone(btn) {
  document.querySelectorAll('.tone-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  currentTone = btn.dataset.tone;
}

// ── GENERATE (simulated streaming with real prompt structure) ──

const PLATFORM_GUIDES = {
  weibo: { maxLen: 140, hashtagCount: 3, style: '简洁有力，适合转发，结尾加话题标签' },
  douyin: { maxLen: 150, hashtagCount: 5, style: '口语化，引发互动，开头直接抓眼球' },
  xhs: { maxLen: 300, hashtagCount: 6, style: '种草感强，真实分享语气，多用 emoji，标题党' }
};

function buildPromptPreview(topic, platform, tone, extra) {
  const guide = PLATFORM_GUIDES[platform];
  const platName = { weibo: '微博', douyin: '抖音', xhs: '小红书' }[platform];
  return `[${platName} · ${tone}]\n热点: ${topic.title}\n热度: ${topic.heatLabel}\n`;
}

async function generatePost() {
  if (isGenerating || !currentTopic) return;
  isGenerating = true;

  const btn = document.getElementById('gen-btn');
  btn.disabled = true;
  btn.innerHTML = `<svg width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" style="animation:spin 1s linear infinite"><path d="M14 8A6 6 0 1 1 8 2"/></svg> 生成中…`;

  const extra = document.getElementById('extra-prompt').value;

  document.getElementById('output-placeholder').style.display = 'none';
  const outputEl = document.getElementById('output-text');
  outputEl.style.display = 'block';
  outputEl.textContent = '';
  outputEl.classList.add('typing');
  document.getElementById('char-count').textContent = '';
  generatedText = '';

  try {
    const res = await fetch(`${API_BASE}/api/generate`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        topic_title: currentTopic.title,
        topic_heat: currentTopic.heatLabel || '',
        topic_platform: currentTopic.platform,
        target_platform: currentPlatform,
        tone: currentTone,
        extra: extra,
      }),
      signal: AbortSignal.timeout(35000),
    });
    const data = await res.json();
    if (!data.ok) throw new Error(data.error || '生成失败');

    // 打字机效果播放返回文本
    const text = data.text;
    let i = 0;
    await new Promise(resolve => {
      const interval = setInterval(() => {
        if (i < text.length) {
          generatedText += text[i];
          outputEl.textContent = generatedText;
          document.getElementById('char-count').textContent = generatedText.length + ' 字';
          i++;
        } else {
          clearInterval(interval);
          resolve();
        }
      }, 18);
    });

  } catch(e) {
    outputEl.textContent = '生成失败：' + (e.message || '请检查后端服务是否运行');
    outputEl.style.color = 'var(--accent2)';
    setTimeout(() => { outputEl.style.color = ''; }, 3000);
  }

  outputEl.classList.remove('typing');
  btn.disabled = false;
  btn.innerHTML = `<svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2"><polygon points="3,2 13,8 3,14"/></svg> 重新生成`;

  if (generatedText && !generatedText.startsWith('生成失败')) {
    document.getElementById('save-btn').style.display = 'flex';
    document.getElementById('copy-btn').style.display = 'flex';
  }
  isGenerating = false;
}

// ── WECHAT ARTICLE ──
async function generateWechat() {
  if (isGenerating || !currentTopic) return;
  isGenerating = true;

  const btn = document.getElementById('wechat-btn');
  const genBtn = document.getElementById('gen-btn');
  btn.disabled = true;
  genBtn.disabled = true;
  btn.innerHTML = `<svg width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" style="animation:spin 1s linear infinite"><path d="M14 8A6 6 0 1 1 8 2"/></svg> 生成中…`;

  const extra = document.getElementById('extra-prompt').value;

  document.getElementById('output-placeholder').style.display = 'none';
  const outputEl = document.getElementById('output-text');
  outputEl.style.display = 'block';
  outputEl.textContent = '正在生成公众号文章 HTML，约需 30-60 秒…';
  document.getElementById('char-count').textContent = '';
  generatedText = '';

  try {
    const res = await fetch(`${API_BASE}/api/generate/wechat`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        topic_title: currentTopic.title,
        topic_heat: currentTopic.heatLabel || '',
        topic_platform: currentTopic.platform,
        article_type: '产品介绍',
        tone: currentTone === '营销种草' ? '亲切简洁' : currentTone,
        extra: extra,
      }),
      signal: AbortSignal.timeout(120000),
    });
    const data = await res.json();
    if (!data.ok) throw new Error(data.error || '生成失败');

    generatedText = data.html;
    const downloadUrl = `${API_BASE}${data.download_url}`;

    outputEl.innerHTML = `
      <div style="padding:12px 0 8px;">
        <span style="color:var(--accent);font-weight:600;">✓ 公众号文章已生成</span>
        <span style="color:var(--text-dim);font-size:12px;margin-left:8px;">${data.filename}</span>
      </div>
      <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:8px;">
        <a href="${downloadUrl}" download="${data.filename}"
           style="display:inline-flex;align-items:center;gap:6px;padding:7px 14px;background:rgba(255,87,34,0.15);color:#FF5722;border:1px solid rgba(255,87,34,0.3);border-radius:6px;font-size:13px;text-decoration:none;cursor:pointer;">
          ↓ 下载 HTML 文件
        </a>
        <button onclick="previewWechat('${downloadUrl}')"
           style="display:inline-flex;align-items:center;gap:6px;padding:7px 14px;background:var(--surface2);color:var(--text);border:1px solid var(--border);border-radius:6px;font-size:13px;cursor:pointer;">
          ↗ 在浏览器预览
        </button>
      </div>
      <pre style="margin-top:12px;font-size:11px;color:var(--text-dim);max-height:120px;overflow:auto;white-space:pre-wrap;">${escapeHtml(data.html.slice(0, 300))}…</pre>
    `;
    document.getElementById('char-count').textContent = `HTML ${data.html.length} 字节`;

  } catch(e) {
    outputEl.textContent = '生成失败：' + (e.message || '请检查后端服务');
    outputEl.style.color = 'var(--accent2)';
    setTimeout(() => { outputEl.style.color = ''; }, 3000);
  }

  btn.disabled = false;
  genBtn.disabled = false;
  btn.innerHTML = `<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg> 公众号文章`;
  isGenerating = false;
}

function previewWechat(url) {
  window.open(url, '_blank');
}

function escapeHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

// ── LIBRARY ──

function saveToLibrary() {
  if (!generatedText || !currentTopic) return;
  const entry = {
    id: Date.now(),
    topic: currentTopic.title,
    platform: currentPlatform,
    tone: currentTone,
    content: generatedText,
    heat: currentTopic.heatLabel,
    createdAt: new Date().toLocaleDateString('zh-CN')
  };
  library.unshift(entry);
  localStorage.setItem('reachall_library', JSON.stringify(library));
  updateStats();
  showToast('已存入推文库 ✓');
  document.getElementById('save-btn').style.display = 'none';
}

function renderLibrary() {
  const grid = document.getElementById('lib-grid');
  document.getElementById('lib-count').textContent = library.length;

  if (!library.length) {
    grid.innerHTML = `<div class="empty-state" style="grid-column:1/-1">
      <div class="empty-icon">✦</div>
      <div>推文库为空</div>
      <div style="margin-top:8px;font-size:12px;">在热榜页点击「生成推文」开始创作</div>
    </div>`;
    return;
  }

  const platName = { weibo: '微博', douyin: '抖音', xhs: '小红书' };
  const platClass = { weibo: 'tag-weibo', douyin: 'tag-douyin', xhs: 'tag-xhs' };

  grid.innerHTML = library.map(entry => `
    <div class="lib-card">
      <div class="lib-card-header">
        <span class="lib-card-platform platform-tag ${platClass[entry.platform]}">${platName[entry.platform]} · ${entry.tone}</span>
        <span class="lib-card-date">${entry.createdAt}</span>
      </div>
      <div class="lib-card-content">${entry.content}</div>
      <div class="lib-card-topic">热点: ${entry.topic} · ${entry.heat}</div>
      <div class="lib-card-footer">
        <button class="lib-action copy" onclick="copyLib(${entry.id})">复制全文</button>
        <button class="lib-action" onclick="deleteLib(${entry.id})">删除</button>
      </div>
    </div>
  `).join('');
}

function copyLib(id) {
  const entry = library.find(e => e.id === id);
  if (!entry) return;
  navigator.clipboard.writeText(entry.content).then(() => showToast('已复制 ✓'));
}

function deleteLib(id) {
  library = library.filter(e => e.id !== id);
  localStorage.setItem('reachall_library', JSON.stringify(library));
  renderLibrary();
  updateStats();
}

function copyGenerated() {
  if (!generatedText) return;
  navigator.clipboard.writeText(generatedText).then(() => showToast('已复制到剪贴板 ✓'));
}

function updateStats() {
  document.getElementById('stat-generated').textContent = library.length;
  document.getElementById('lib-count-nav').textContent = library.length;
}

// ── TOAST ──

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2200);
}

// ── INIT ──

document.addEventListener('DOMContentLoaded', () => {
  updateStats();
  loadTrends();
  setInterval(loadTrends, 5 * 60 * 1000);
});

// Keyboard close modal
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') document.getElementById('modal-overlay').classList.remove('open');
});
</script>
</body>
